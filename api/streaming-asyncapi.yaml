asyncapi: 3.0.0
info:
  title: MobilityAPI — MF Stream (Continuous Query)
  version: '1.0'
  description: >-
    The channels of the continuous queries of the Stream proposal for OGC API –
    Moving Features, MobilityAPI extensions (OGC holds no draft of a Stream
    part). A query is registered over HTTP (see the OpenAPI
    surface); its results are delivered on the SSE channel referenced by the
    cquery link object's `channel`.

servers:
  tier:
    host: localhost:8088
    protocol: http
    description: The MobilityAPI tier.
  tierWebSocket:
    host: localhost:8088
    protocol: ws
    description: >-
      The MobilityAPI tier, whose continuous queries also deliver their results
      over a WebSocket, a MobilityAPI extension: each result is one text
      message, the JSON object an SSE event carries, and the connection closes
      with a normal closure when the query stops.
  kafka:
    host: '{brokers}'
    protocol: kafka
    description: >-
      The brokers MFAPI_KAFKA_BROKERS names, to which a continuous query
      registered with a topic publishes its results, a MobilityAPI extension:
      one record per result, keyed by the query's id, its value the JSON object
      an SSE event carries.
    variables:
      brokers: { description: 'the comma-separated host:port of MFAPI_KAFKA_BROKERS' }

channels:
  propertyResults:
    address: /collections/{cid}/items/{fid}/tproperties/{name}/queries/{queryId}/stream
    description: Results of a property continuous query (a transform or a windowed aggregate).
    parameters:
      cid: { description: collection id }
      fid: { description: feature id }
      name: { description: temporal property name }
      queryId: { description: registered query id }
    messages:
      transform:
        $ref: '#/components/messages/transform'
      windowAggregate:
        $ref: '#/components/messages/windowAggregate'
  geometryResults:
    address: /collections/{cid}/items/{fid}/tgsequence/queries/{queryId}/stream
    description: >-
      Positions of a moving feature (a geometry continuous query), or, for a
      query with an aggregation and a window, one aggregate of the feature's
      temporal geometry per window (a MobilityAPI extension following Table 7
      of the Stream proposal; no OGC class is claimed).
    parameters:
      cid: { description: collection id }
      fid: { description: feature id }
      queryId: { description: registered query id }
    messages:
      position:
        $ref: '#/components/messages/position'
      geometryWindowAggregate:
        $ref: '#/components/messages/geometryWindowAggregate'

  propertyResultsWebSocket:
    address: /collections/{cid}/items/{fid}/tproperties/{name}/queries/{queryId}/ws
    description: The results of a property continuous query over a WebSocket.
    servers:
      - $ref: '#/servers/tierWebSocket'
    parameters:
      cid: { description: collection id }
      fid: { description: feature id }
      name: { description: temporal property name }
      queryId: { description: registered query id }
    messages:
      transform:
        $ref: '#/components/messages/transform'
      windowAggregate:
        $ref: '#/components/messages/windowAggregate'
  geometryResultsWebSocket:
    address: /collections/{cid}/items/{fid}/tgsequence/queries/{queryId}/ws
    description: The results of a geometry continuous query over a WebSocket.
    servers:
      - $ref: '#/servers/tierWebSocket'
    parameters:
      cid: { description: collection id }
      fid: { description: feature id }
      queryId: { description: registered query id }
    messages:
      position:
        $ref: '#/components/messages/position'
      geometryWindowAggregate:
        $ref: '#/components/messages/geometryWindowAggregate'

  kafkaResults:
    address: '{topic}'
    description: The results of a continuous query registered with a topic.
    servers:
      - $ref: '#/servers/kafka'
    parameters:
      topic: { description: the topic the query names }
    messages:
      transform:
        $ref: '#/components/messages/transform'
      windowAggregate:
        $ref: '#/components/messages/windowAggregate'
      position:
        $ref: '#/components/messages/position'
      geometryWindowAggregate:
        $ref: '#/components/messages/geometryWindowAggregate'

operations:
  receivePropertyResults:
    action: receive
    channel: { $ref: '#/channels/propertyResults' }
  receiveGeometryResults:
    action: receive
    channel: { $ref: '#/channels/geometryResults' }
  receivePropertyResultsWebSocket:
    action: receive
    channel: { $ref: '#/channels/propertyResultsWebSocket' }
  receiveGeometryResultsWebSocket:
    action: receive
    channel: { $ref: '#/channels/geometryResultsWebSocket' }
  receiveKafkaResults:
    action: receive
    channel: { $ref: '#/channels/kafkaResults' }

components:
  messages:
    transform:
      name: transform
      title: Transformed instant
      contentType: application/json
      payload:
        type: object
        required: [datetime, value]
        properties:
          datetime: { type: string }
          value: { type: number }
          property: { type: string }
          operation: { type: string }
    windowAggregate:
      name: windowAggregate
      title: Window aggregate
      contentType: application/json
      payload:
        type: object
        required: [windowStart, windowEnd, aggregation, value, count]
        properties:
          windowStart: { type: string }
          windowEnd: { type: string }
          aggregation: { type: string, enum: [COUNT, SUM, AVG, MIN, MAX] }
          value: { type: number }
          count: { type: integer }
          property: { type: string }
    geometryWindowAggregate:
      name: geometryWindowAggregate
      title: Window aggregate of a temporal geometry
      contentType: application/json
      payload:
        type: object
        required: [windowStart, windowEnd, aggregation, value, count]
        properties:
          windowStart: { type: string }
          windowEnd: { type: string }
          aggregation: { type: string, enum: [COUNT, LENGTH, AREA, INTERSECT, TO_TRAJ] }
          value:
            description: >-
              COUNT, the instants of the window; LENGTH, the distance a moving
              point travels, or the length a line covers, each overlap counted
              once; AREA, the area a line or polygon covers, each overlap
              counted once; INTERSECT, whether the window meets the query's
              region; TO_TRAJ, the path of the window in GeoJSON (WGS 84)
            oneOf:
              - { type: number }
              - { type: boolean }
              - { type: object }
          count: { type: integer }
    position:
      name: position
      title: Moving-feature position
      contentType: application/json
      payload:
        type: object
        required: [datetime, coordinates]
        properties:
          datetime: { type: string }
          coordinates:
            type: array
            items: { type: number }
            minItems: 2
            maxItems: 3
